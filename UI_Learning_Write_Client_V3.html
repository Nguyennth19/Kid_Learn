<script>
/**
 * ================================================================
 * KIDLEARN V3 - LEARNING WRITE CLIENT
 * Step: 3J.4
 * ================================================================
 *
 * Client này dành cho UI học tập DEV.
 * Tất cả request đi qua Write Router V3.
 * Tất cả vẫn là DRY_RUN.
 */

window.KidlearnV3LearningWrite = (function() {
  function getStatus() {
    return KidlearnV3WriteRouter.getStatus();
  }

  function getSampleContext() {
    return KidlearnV3WriteRouter.getSampleContext();
  }

  function auditEvent(payload) {
    return KidlearnV3WriteRouter.auditEvent(
      payload || {}
    );
  }

  function startStudy(payload) {
    return KidlearnV3WriteRouter.studyStart(
      payload || {}
    );
  }

  function finishStudy(payload) {
    return KidlearnV3WriteRouter.studyFinish(
      payload || {}
    );
  }

  function saveLessonProgress(payload) {
    return KidlearnV3WriteRouter.lessonProgressSave(
      payload || {}
    );
  }

  function saveDailyGoal(payload) {
    return KidlearnV3WriteRouter.dailyGoalSave(
      payload || {}
    );
  }

  function assignmentStart(payload) {
    return KidlearnV3WriteRouter.assignmentStart(
      payload || {}
    );
  }

  function assignmentProgress(payload) {
    return KidlearnV3WriteRouter.assignmentProgress(
      payload || {}
    );
  }

  function assignmentComplete(payload) {
    return KidlearnV3WriteRouter.assignmentComplete(
      payload || {}
    );
  }

  function unwrap(response) {
    return KidlearnV3WriteRouter.unwrap(
      response
    );
  }

  function makeDryRunSessionId() {
    var now =
      new Date();

    return (
      'DRY_RUN_SESSION_' +
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, '0') +
      String(now.getDate()).padStart(2, '0') +
      '_' +
      String(now.getHours()).padStart(2, '0') +
      String(now.getMinutes()).padStart(2, '0') +
      String(now.getSeconds()).padStart(2, '0')
    );
  }

  function today() {
    var date =
      new Date();

    var year =
      date.getFullYear();

    var month =
      String(date.getMonth() + 1)
        .padStart(2, '0');

    var day =
      String(date.getDate())
        .padStart(2, '0');

    return year + '-' + month + '-' + day;
  }

  return {
    getStatus: getStatus,
    getSampleContext: getSampleContext,
    auditEvent: auditEvent,
    startStudy: startStudy,
    finishStudy: finishStudy,
    saveLessonProgress: saveLessonProgress,
    saveDailyGoal: saveDailyGoal,
    assignmentStart: assignmentStart,
    assignmentProgress: assignmentProgress,
    assignmentComplete: assignmentComplete,
    unwrap: unwrap,
    makeDryRunSessionId: makeDryRunSessionId,
    today: today
  };
})();
</script>
