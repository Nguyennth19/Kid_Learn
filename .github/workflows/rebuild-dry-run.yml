name: Rebuild Firebase MVP dry run

on:
  push:
    branches:
      - rebuild/firebase-mvp
    paths:
      - ".github/workflows/rebuild-dry-run.yml"
      - "app/public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "docs/rebuild/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-dry-run.yml"
      - "app/public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "docs/rebuild/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-firebase-mvp-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rebuild:
    name: Validate DRY_RUN, rules and application shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIDLEARN_SETUP_MODE: DRY_RUN
      FIREBASE_PROJECT: kidlearn-dev-2026

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/system.seed.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/subjects.seed.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/courses.seed.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/lessons.seed.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/lesson-blocks.seed.json', 'utf8'))"

      - name: Validate application, smoke and seed sources
        run: |
          test -f app/public/index.html
          test -f app/public/styles.css
          test -f app/public/firebase-config.js
          node --check app/public/firebase-config.js
          test -f app/public/smoke.html
          test -f app/public/smoke.js
          test -f app/public/services/firebase.js
          test -f app/public/services/auth-service.js
          test -f app/public/services/profile-service.js
          test -f app/public/services/catalog-service.js
          node --check app/public/app.js
          node --check app/public/smoke.js
          node --check app/public/services/firebase.js
          node --check app/public/services/auth-service.js
          node --check app/public/services/profile-service.js
          node --check app/public/services/catalog-service.js
          node --check scripts/setup-firestore.mjs
          grep -q 'doc(db, "children", appConfig.childId)' app/public/services/profile-service.js
          ! grep -q 'collection(db, "children")' app/public/services/profile-service.js
          grep -q "kidlearn-dev-2026" app/public/firebase-config.js
          grep -q "Không gian học tập gia đình" app/public/index.html
          grep -q "lesson-player" app/public/index.html
          grep -q "getLessonBlocks" app/public/services/catalog-service.js
          grep -q "DISPLAY_ONLY" scripts/seed/lesson-blocks.seed.json
          grep -q "Read-only smoke test" app/public/smoke.html
          ! grep -R -E "addDoc|setDoc|updateDoc|deleteDoc" app/public --include="*.js"
          test -f docs/rebuild/firestore-schema-5i.md
          grep -q "match /courses/{courseId}" firestore.rules
          grep -q 'WRITE_12_DEV_DOCUMENTS' scripts/setup-firestore.mjs
          grep -q 'KIDLEARN_CONFIRM_PROJECT' scripts/setup-firestore.mjs
          grep -q 'KIDLEARN_CONFIRM_WRITE' scripts/setup-firestore.mjs
          grep -q 'batch.set(refs\[index\], item.data, { merge: true })' scripts/setup-firestore.mjs

      - name: Run Firestore setup preview
        run: node scripts/setup-firestore.mjs | tee dry-run-output.json

      - name: Verify safety assertions
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('dry-run-output.json','utf8')); if(!r.success || r.phase!=='5I-C' || r.mode!=='DRY_RUN' || r.projectId!=='kidlearn-dev-2026' || r.plannedDocumentCount!==12 || r.actualFirestoreWritePerformed!==false || r.actualAuthenticationWritePerformed!==false){console.error(r); process.exit(1)}"

      - name: Test Firestore Security Rules in Emulator
        run: npm run test:rules

      - name: Write workflow summary
        if: always()
        run: |
          echo "## KIDLEARN Phase 5I-E preview readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project guard: kidlearn-dev-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI setup mode: DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Planned documents: 12" >> "$GITHUB_STEP_SUMMARY"
          echo "- Guarded DEV apply mode: available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge strategy: no deletion, no duplicate document paths" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firestore write during CI: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication write: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rules validation: Firebase Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application shell mode: read-only" >> "$GITHUB_STEP_SUMMARY"
          echo "- CHILD catalog navigation: subject → course → lesson" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lesson player: 4 ordered blocks, display-only interaction" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hosted acceptance target: CHILD opens Tiếng Việt → Tiếng Việt lớp 2 → Bảng chữ cái và nguyên âm" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview policy: temporary Hosting channel only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Hosting deployment: not performed by CI" >> "$GITHUB_STEP_SUMMARY"
