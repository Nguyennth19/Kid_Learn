name: Rebuild Firebase MVP validation

on:
  push:
    branches:
      - rebuild/firebase-mvp
    paths:
      - ".github/workflows/rebuild-dry-run.yml"
      - "app/public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-dry-run.yml"
      - "app/public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-firebase-mvp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rebuild:
    name: Validate DRY_RUN, rules and smoke page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIDLEARN_SETUP_MODE: DRY_RUN
      FIREBASE_PROJECT: kidlearn-dev-2026

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/system.seed.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('scripts/seed/subjects.seed.json', 'utf8'))"

      - name: Validate smoke test source
        run: |
          test -f app/public/index.html
          test -f app/public/styles.css
          test -f app/public/firebase-config.js
          node --check app/public/firebase-config.js
          node --check app/public/app.js
          grep -q "kidlearn-dev-2026" app/public/firebase-config.js
          grep -q "Read-only smoke test" app/public/index.html

      - name: Run Firestore setup preview
        run: node scripts/setup-firestore.mjs | tee dry-run-output.json

      - name: Verify safety assertions
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('dry-run-output.json','utf8')); if(!r.success || r.mode!=='DRY_RUN' || r.projectId!=='kidlearn-dev-2026' || r.plannedDocumentCount!==6 || r.actualFirestoreWritePerformed!==false || r.actualAuthenticationWritePerformed!==false){console.error(r); process.exit(1)}"

      - name: Test Firestore Security Rules in Emulator
        run: npm run test:rules

      - name: Write workflow summary
        if: always()
        run: |
          echo "## KIDLEARN Phase 5G" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project guard: kidlearn-dev-2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- Setup mode: DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Planned documents: 6" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firestore setup write: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication setup write: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rules validation: Firebase Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke page mode: read-only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Hosting deployment: not performed" >> "$GITHUB_STEP_SUMMARY"
