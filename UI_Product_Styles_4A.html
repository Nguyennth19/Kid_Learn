<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800;6..12,900&display=swap');

  :root {
    --kl-bg: #f5f7ff;
    --kl-card: #ffffff;
    --kl-text: #111827;
    --kl-muted: #6b7280;
    --kl-border: #e5e7eb;
    --kl-primary: #6d5dfc;
    --kl-primary-dark: #5145cd;
    --kl-blue: #3b82f6;
    --kl-purple: #8b5cf6;
    --kl-pink: #ec4899;
    --kl-green: #22c55e;
    --kl-orange: #f97316;
    --kl-shadow: 0 18px 50px rgba(79, 70, 229, 0.12);
    --kl-radius-xl: 28px;
    --kl-radius-lg: 22px;
    --kl-radius-md: 16px;
    --kl-font-heading: 'Be Vietnam Pro', 'Nunito Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --kl-font-body: 'Nunito Sans', 'Be Vietnam Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at top left, rgba(109,93,252,.16), transparent 32%),
      radial-gradient(circle at bottom right, rgba(34,197,94,.12), transparent 30%),
      var(--kl-bg);
    color: var(--kl-text);
    font-family: var(--kl-font-body);
    font-weight: 600;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  input,
  select {
    font-family: inherit;
  }

  .kl-app {
    min-height: 100vh;
    display: flex;
  }

  .kl-sidebar {
    width: 280px;
    min-height: 100vh;
    background: rgba(255,255,255,.92);
    border-right: 1px solid rgba(229,231,235,.9);
    padding: 24px 18px;
    position: sticky;
    top: 0;
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .kl-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 8px 14px;
  }

  .kl-brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 18px;
    background: linear-gradient(135deg, #6d5dfc, #22c55e);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 24px;
    box-shadow: 0 14px 28px rgba(109,93,252,.25);
  }

  .kl-brand-title {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .4px;
  }

  .kl-brand-title span:first-child {
    color: #ef4444;
  }

  .kl-brand-title span:last-child {
    color: #2563eb;
  }

  .kl-brand-subtitle {
    color: var(--kl-muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .kl-profile-mini {
    background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    border: 1px solid #e0e7ff;
    border-radius: 22px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .kl-avatar {
    width: 48px;
    height: 48px;
    border-radius: 18px;
    background: #fff;
    display: grid;
    place-items: center;
    font-size: 26px;
  }

  .kl-profile-name {
    font-weight: 800;
    font-size: 15px;
  }

  .kl-profile-grade {
    color: var(--kl-muted);
    font-size: 13px;
    margin-top: 3px;
  }

  .kl-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .kl-nav-item {
    border: 0;
    background: transparent;
    color: #374151;
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    transition: all .18s ease;
  }

  .kl-nav-item:hover {
    background: #f3f4ff;
    color: var(--kl-primary);
  }

  .kl-nav-item.active {
    background: var(--kl-primary);
    color: #fff;
    box-shadow: 0 12px 26px rgba(109,93,252,.28);
  }

  .kl-sidebar-bottom {
    margin-top: auto;
    display: grid;
    gap: 8px;
  }

  .kl-role-btn {
    border: 1px solid var(--kl-border);
    background: #fff;
    padding: 11px 12px;
    border-radius: 14px;
    font-weight: 800;
    cursor: pointer;
    color: #374151;
  }

  .kl-role-btn.active {
    background: #eef2ff;
    color: var(--kl-primary);
    border-color: #c7d2fe;
  }

  .kl-main {
    flex: 1;
    padding: 24px;
    max-width: 1480px;
    margin: 0 auto;
  }

  .kl-header {
    background: rgba(255,255,255,.88);
    border: 1px solid rgba(229,231,235,.9);
    border-radius: var(--kl-radius-xl);
    padding: 18px 22px;
    box-shadow: var(--kl-shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    backdrop-filter: blur(16px);
  }

  .kl-menu-toggle {
    display: none;
    border: 0;
    background: #eef2ff;
    color: var(--kl-primary);
    border-radius: 14px;
    width: 44px;
    height: 44px;
    font-size: 22px;
    cursor: pointer;
  }

  .kl-header-kicker {
    color: var(--kl-primary);
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .kl-header h1 {
    margin: 0;
    font-size: 26px;
  }

  .kl-header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .kl-pill {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #c2410c;
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 900;
    white-space: nowrap;
  }

  .kl-screen {
    animation: klFade .22s ease;
  }

  .hidden {
    display: none !important;
  }

  @keyframes klFade {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .kl-login-screen {
    min-height: calc(100vh - 140px);
    display: grid;
    place-items: center;
  }

  .kl-login-card {
    width: min(1050px, 100%);
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 22px;
  }

  .kl-login-hero,
  .kl-login-box {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 34px;
    box-shadow: var(--kl-shadow);
    padding: 34px;
  }

  .kl-login-hero {
    background:
      radial-gradient(circle at 20% 20%, rgba(109,93,252,.18), transparent 35%),
      radial-gradient(circle at 80% 80%, rgba(34,197,94,.16), transparent 35%),
      #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 420px;
  }

  .kl-large-logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: .8px;
    color: var(--kl-primary);
  }

  .kl-login-hero p {
    font-size: 19px;
    color: var(--kl-muted);
  }

  .kl-login-box h2 {
    margin-top: 0;
    font-size: 28px;
  }

  .kl-login-box label {
    display: block;
    margin: 16px 0 7px;
    font-weight: 800;
    color: #374151;
  }

  .kl-login-box input,
  .kl-login-box select {
    width: 100%;
    border: 1px solid var(--kl-border);
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 15px;
    outline: none;
    background: #fff;
  }

  .kl-login-box input:focus,
  .kl-login-box select:focus {
    border-color: var(--kl-primary);
    box-shadow: 0 0 0 4px rgba(109,93,252,.12);
  }

  .kl-muted {
    color: var(--kl-muted);
    line-height: 1.6;
  }

  .kl-primary-btn,
  .kl-secondary-btn,
  .kl-text-btn {
    border: 0;
    cursor: pointer;
    border-radius: 16px;
    font-weight: 900;
    transition: all .18s ease;
  }

  .kl-primary-btn {
    background: var(--kl-primary);
    color: #fff;
    padding: 13px 18px;
    box-shadow: 0 12px 24px rgba(109,93,252,.25);
  }

  .kl-primary-btn:hover {
    background: var(--kl-primary-dark);
    transform: translateY(-1px);
  }

  .kl-secondary-btn {
    background: #eef2ff;
    color: var(--kl-primary);
    padding: 13px 18px;
  }

  .kl-text-btn {
    background: transparent;
    color: var(--kl-primary);
    padding: 13px 18px;
    width: 100%;
    margin-top: 8px;
  }

  #loginButton {
    width: 100%;
    margin-top: 20px;
  }

  .kl-hero-card {
    background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
    color: #fff;
    border-radius: 34px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1.4fr .6fr;
    gap: 18px;
    box-shadow: 0 26px 70px rgba(109,93,252,.28);
    overflow: hidden;
    position: relative;
  }

  .kl-hero-card.parent {
    background: linear-gradient(135deg, #2563eb, #22c55e);
  }

  .kl-hero-kicker {
    font-size: 14px;
    font-weight: 900;
    opacity: .9;
  }

  .kl-hero-card h2 {
    font-size: 34px;
    line-height: 1.15;
    margin: 8px 0 10px;
  }

  .kl-hero-card p {
    margin: 0;
    line-height: 1.65;
    opacity: .92;
  }

  .kl-hero-actions {
    display: flex;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .kl-hero-actions .kl-secondary-btn {
    background: rgba(255,255,255,.18);
    color: #fff;
  }

  .kl-hero-illustration {
    position: relative;
    min-height: 180px;
  }

  .kl-bubble {
    position: absolute;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(255,255,255,.28);
    display: grid;
    place-items: center;
    border-radius: 999px;
    backdrop-filter: blur(8px);
  }

  .kl-bubble.big {
    width: 132px;
    height: 132px;
    font-size: 58px;
    right: 16px;
    top: 10px;
  }

  .kl-bubble.mid {
    width: 72px;
    height: 72px;
    font-size: 34px;
    left: 0;
    bottom: 10px;
  }

  .kl-bubble.small {
    width: 54px;
    height: 54px;
    font-size: 26px;
    right: 8px;
    bottom: 2px;
  }

  .kl-stat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin: 22px 0;
  }

  .kl-stat-card {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(15,23,42,.06);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .kl-stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 18px;
    background: #eef2ff;
    display: grid;
    place-items: center;
    font-size: 24px;
  }

  .kl-stat-value {
    font-size: 24px;
    font-weight: 900;
  }

  .kl-stat-value.small {
    font-size: 18px;
  }

  .kl-stat-label {
    color: var(--kl-muted);
    font-size: 13px;
    margin-top: 2px;
  }

  .kl-section-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: end;
    margin: 24px 0 14px;
  }

  .kl-section-head h2 {
    margin: 0;
    font-size: 24px;
  }

  .kl-section-head p {
    margin: 5px 0 0;
    color: var(--kl-muted);
  }

  .kl-subject-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
  }

  .kl-subject-card {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 28px;
    padding: 20px;
    box-shadow: 0 14px 34px rgba(15,23,42,.06);
    cursor: pointer;
    transition: all .18s ease;
  }

  .kl-subject-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 45px rgba(15,23,42,.09);
  }

  .kl-subject-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 10px;
  }

  .kl-subject-icon {
    width: 54px;
    height: 54px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    font-size: 28px;
  }

  .subject-blue .kl-subject-icon { background: #dbeafe; }
  .subject-purple .kl-subject-icon { background: #ede9fe; }
  .subject-pink .kl-subject-icon { background: #fce7f3; }
  .subject-green .kl-subject-icon { background: #dcfce7; }

  .kl-subject-card h3 {
    margin: 18px 0 6px;
    font-size: 19px;
  }

  .kl-subject-card p {
    margin: 0;
    color: var(--kl-muted);
    font-size: 14px;
    line-height: 1.5;
  }

  .kl-progress {
    height: 10px;
    background: #f3f4f6;
    border-radius: 999px;
    margin: 16px 0 8px;
    overflow: hidden;
  }

  .kl-progress span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--kl-primary);
  }

  .subject-blue .kl-progress span { background: var(--kl-blue); }
  .subject-purple .kl-progress span { background: var(--kl-purple); }
  .subject-pink .kl-progress span { background: var(--kl-pink); }
  .subject-green .kl-progress span { background: var(--kl-green); }

  .kl-subject-meta {
    font-size: 13px;
    color: var(--kl-muted);
  }

  .kl-two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 22px;
  }

  .kl-panel {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 12px 32px rgba(15,23,42,.06);
  }

  .kl-panel h3 {
    margin: 0 0 14px;
  }

  .kl-panel p {
    color: var(--kl-muted);
    line-height: 1.7;
  }

  .kl-plan-list {
    display: grid;
    gap: 10px;
  }

  .kl-plan-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f9fafb;
    border: 1px solid #f3f4f6;
    border-radius: 18px;
    padding: 13px;
  }

  .kl-plan-left {
    display: flex;
    gap: 12px;
    align-items: center;
    font-weight: 800;
  }

  .kl-plan-status {
    color: var(--kl-primary);
    font-size: 13px;
    font-weight: 900;
  }

  .kl-progress-row {
    margin-bottom: 16px;
  }

  .kl-progress-row-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-weight: 800;
  }

  .kl-empty-state {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 32px;
    padding: 44px;
    text-align: center;
    box-shadow: var(--kl-shadow);
  }

  .kl-empty-icon {
    font-size: 54px;
    margin-bottom: 12px;
  }

  @media (max-width: 1100px) {
    .kl-subject-grid,
    .kl-stat-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .kl-login-card,
    .kl-hero-card,
    .kl-two-columns {
      grid-template-columns: 1fr;
    }

    .kl-hero-illustration {
      min-height: 120px;
    }
  }

  @media (max-width: 760px) {
    .kl-app {
      display: block;
    }

    .kl-sidebar {
      width: 100%;
      min-height: auto;
      position: relative;
      border-right: 0;
      border-bottom: 1px solid var(--kl-border);
    }

    .kl-sidebar.mobile-collapsed .kl-profile-mini,
    .kl-sidebar.mobile-collapsed .kl-nav,
    .kl-sidebar.mobile-collapsed .kl-sidebar-bottom {
      display: none;
    }

    .kl-main {
      padding: 14px;
    }

    .kl-header {
      border-radius: 22px;
    }

    .kl-menu-toggle {
      display: block;
    }

    .kl-header-actions {
      display: none;
    }

    .kl-stat-grid,
    .kl-subject-grid {
      grid-template-columns: 1fr;
    }

    .kl-login-card {
      grid-template-columns: 1fr;
    }

    .kl-login-hero {
      min-height: 240px;
    }

    .kl-large-logo {
      font-size: 34px;
    }

    .kl-hero-card h2 {
      font-size: 26px;
    }
  }

  /**
   * ================================================================
   * KIDLEARN V3 Font Standard - Phase 4A-1D
   * Heading: Be Vietnam Pro
   * Body: Nunito Sans
   * ================================================================
   */

  h1,
  h2,
  h3,
  .kl-brand-title,
  .kl-large-logo,
  .kl-header-kicker,
  .kl-hero-kicker,
  .kl-nav-item,
  .kl-role-btn,
  .kl-primary-btn,
  .kl-secondary-btn,
  .kl-text-btn,
  .kl-pill,
  .kl-stat-value,
  .kl-profile-name,
  .kl-subject-card h3,
  .kl-plan-status {
    font-family: var(--kl-font-heading);
  }

  p,
  .kl-muted,
  .kl-brand-subtitle,
  .kl-profile-grade,
  .kl-stat-label,
  .kl-subject-meta,
  .kl-login-box input,
  .kl-login-box select,
  .kl-panel,
  .kl-plan-item {
    font-family: var(--kl-font-body);
  }

  .kl-brand-title,
  .kl-large-logo,
  .kl-header h1,
  .kl-hero-card h2,
  .kl-section-head h2 {
    letter-spacing: -0.035em;
  }

  .kl-panel p,
  .kl-login-hero p,
  .kl-hero-card p,
  .kl-section-head p {
    font-weight: 500;
    letter-spacing: -0.005em;
  }

  .kl-subject-card p,
  .kl-empty-state p {
    font-weight: 600;
  }

  /**
   * ================================================================
   * KIDLEARN V3 - Phase 4B-2 UI Upgrade
   * Child Home + Courses Dashboard
   * ================================================================
   */

  .kl-4b-hero-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(300px, .6fr);
    gap: 18px;
    align-items: stretch;
  }

  .kl-next-lesson-card {
    background:
      radial-gradient(circle at top right, rgba(249,115,22,.16), transparent 36%),
      #ffffff;
    border: 1px solid var(--kl-border);
    border-radius: 34px;
    padding: 24px;
    box-shadow: var(--kl-shadow);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 260px;
  }

  .kl-card-kicker {
    color: var(--kl-primary);
    font-family: var(--kl-font-heading);
    font-weight: 900;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .02em;
  }

  .kl-next-icon {
    width: 70px;
    height: 70px;
    border-radius: 26px;
    display: grid;
    place-items: center;
    font-size: 34px;
    background: #eef2ff;
    margin: 18px 0 10px;
  }

  .kl-next-lesson-card h3 {
    margin: 0 0 8px;
    font-size: 22px;
    line-height: 1.25;
  }

  .kl-next-lesson-card p {
    color: var(--kl-muted);
    line-height: 1.55;
    margin: 0 0 18px;
    font-weight: 600;
  }

  .kl-course-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kl-course-summary-card {
    background: #fff;
    border: 1px solid var(--kl-border);
    border-radius: 26px;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(15,23,42,.06);
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .kl-course-summary-icon {
    width: 52px;
    height: 52px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    background: #eef2ff;
    font-size: 25px;
  }

  .kl-course-summary-value {
    font-family: var(--kl-font-heading);
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -0.035em;
  }

  .kl-course-summary-label {
    color: var(--kl-muted);
    font-size: 13px;
    font-weight: 700;
  }

  .kl-subject-card-4b {
    position: relative;
    overflow: hidden;
  }

  .kl-subject-card-4b::after {
    content: "";
    position: absolute;
    right: -34px;
    top: -34px;
    width: 104px;
    height: 104px;
    border-radius: 999px;
    background: rgba(109,93,252,.07);
    pointer-events: none;
  }

  .kl-subject-badge {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    color: #475569;
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: var(--kl-font-heading);
    font-weight: 900;
  }

  .subject-blue .kl-subject-badge {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
  }

  .subject-purple .kl-subject-badge {
    background: #f5f3ff;
    border-color: #ddd6fe;
    color: #6d28d9;
  }

  :root {

    --kl-card-blue-border: #BFDBFE;

    --kl-card-green-pastel: #F0FDF4;
    --kl-card-green-border: #BBF7D0;
    --kl-card-green-strong: #15803D;

    --kl-card-yellow-pastel: #FFFBEB;
    --kl-card-yellow-border: #FDE68A;
    --kl-card-yellow-strong: #B45309;

    --kl-card-purple-pastel: #F5F3FF;
    --kl-card-purple-border: #DDD6FE;
    --kl-card-purple-strong: #6D28D9;

    --kl-card-pink-pastel: #FDF2F8;
    --kl-card-pink-border: #FBCFE8;
    --kl-card-pink-strong: #BE185D;

    --kl-card-orange-pastel: #FFF7ED;
    --kl-card-orange-border: #FED7AA;
    --kl-card-orange-strong: #C2410C;

    --kl-contrast-dark: #0F172A;
    --kl-contrast-white: #FFFFFF;

  /**
   * Hero contrast fix.
   * Lỗi cũ: “Xin chào” xanh trên nền xanh nên khó đọc.
   */
  .kl-hero-card .kl-hero-kicker {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    max-width: 100%;
    color: #FFFFFF;
    background: rgba(15, 23, 42, .22);
    border: 1px solid rgba(255, 255, 255, .34);
    border-radius: 999px;
    padding: 8px 13px;
    font-weight: 900;
    text-shadow: 0 1px 2px rgba(15, 23, 42, .18);
  }

  .kl-hero-card h2 {
    color: #FFFFFF;
    text-shadow: 0 2px 6px rgba(15, 23, 42, .14);
  }

  .kl-hero-card p {
    color: rgba(255, 255, 255, .94);
  }

  /**
   * Hero button contrast fix.
   * Lỗi cũ: secondary hover có thể trắng nền + trắng chữ.
   */
  .kl-hero-card .kl-primary-btn {
    background: #FFFFFF;
    color: #1D4ED8;
    border: 1px solid rgba(255, 255, 255, .82);
    box-shadow: 0 16px 36px rgba(15, 23, 42, .16);
  }

  .kl-hero-card .kl-primary-btn:hover {
    background: #FFFBEB;
    color: #0F172A;
    transform: translateY(-1px);
    box-shadow: 0 20px 44px rgba(15, 23, 42, .20);
  }

  .kl-hero-card .kl-secondary-btn {
    background: rgba(255, 255, 255, .20);
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, .62);
    box-shadow: 0 12px 30px rgba(15, 23, 42, .10);
  }

  .kl-hero-card .kl-secondary-btn:hover {
    background: #FFFFFF;
    color: #1D4ED8;
    border-color: #FFFFFF;
    transform: translateY(-1px);
    box-shadow: 0 18px 40px rgba(15, 23, 42, .18);
  }

  /**
   * Login role contrast.
   */
  .kl-login-role-card.active {
    border-color: #93C5FD;
    background: linear-gradient(135deg, #EFF6FF, #FFFFFF);
  }

  .kl-login-role-card.active strong {
    color: #1D4ED8;
  }

  /**
   * Subject card pastel backgrounds.
   * Mục tiêu: vui hơn, tăng nhận diện môn học, nhưng không rối mắt.
   */
  .kl-subject-card-4b {
    border-width: 1.5px;
  }

  .kl-subject-card-4b h3 {
    color: #0F172A;
  }

  .kl-subject-card-4b p,
  .kl-subject-card-4b .kl-subject-next,
  .kl-subject-card-4b .kl-subject-meta {
    color: #334155;
  }

  .kl-subject-card-4b.subject-blue {
    background:
      radial-gradient(circle at 92% 8%, rgba(56,189,248,.22), transparent 34%),
      linear-gradient(135deg, #EFF6FF, #FFFFFF);
    border-color: #BFDBFE;
  }

  .kl-subject-card-4b.subject-blue h3 {
    color: #1D4ED8;
  }

  .kl-subject-card-4b.subject-blue .kl-subject-icon.has-svg-4b2r4,
  .kl-subject-card-4b.subject-blue .kl-subject-icon {
    background: #FFFFFF;
    border-color: #BFDBFE;
  }

  .kl-subject-card-4b.subject-purple {
    background:
      radial-gradient(circle at 92% 8%, rgba(139,92,246,.18), transparent 34%),
      linear-gradient(135deg, #F5F3FF, #FFFFFF);
    border-color: #DDD6FE;
  }

  .kl-subject-card-4b.subject-purple h3 {
    color: #6D28D9;
  }

  .kl-subject-card-4b.subject-purple .kl-subject-icon.has-svg-4b2r4,
  .kl-subject-card-4b.subject-purple .kl-subject-icon {
    background: #FFFFFF;
    border-color: #DDD6FE;
  }

  .kl-subject-card-4b.subject-pink {
    background:
      radial-gradient(circle at 92% 8%, rgba(236,72,153,.16), transparent 34%),
      linear-gradient(135deg, #FDF2F8, #FFFFFF);
    border-color: #FBCFE8;
  }

  .kl-subject-card-4b.subject-pink h3 {
    color: #BE185D;
  }

  .kl-subject-card-4b.subject-pink .kl-subject-icon.has-svg-4b2r4,
  .kl-subject-card-4b.subject-pink .kl-subject-icon {
    background: #FFFFFF;
    border-color: #FBCFE8;
  }

  .kl-subject-card-4b.subject-green {
    background:
      radial-gradient(circle at 92% 8%, rgba(34,197,94,.18), transparent 34%),
      linear-gradient(135deg, #F0FDF4, #FFFFFF);
    border-color: #BBF7D0;
  }

  .kl-subject-card-4b.subject-green h3 {
    color: #15803D;
  }

  .kl-subject-card-4b.subject-green .kl-subject-icon.has-svg-4b2r4,
  .kl-subject-card-4b.subject-green .kl-subject-icon {
    background: #FFFFFF;
    border-color: #BBF7D0;
  }

  /**
   * Subject CTA contrast by card color.
   */
  .kl-subject-card-4b.subject-blue .kl-subject-cta {
    background: #DBEAFE;
    color: #1D4ED8;
  }

  .kl-subject-card-4b.subject-purple .kl-subject-cta {
    background: #EDE9FE;
    color: #6D28D9;
  }

  .kl-subject-card-4b.subject-pink .kl-subject-cta {
    background: #FCE7F3;
    color: #BE185D;
  }

  .kl-subject-card-4b.subject-green .kl-subject-cta {
    background: #DCFCE7;
    color: #15803D;
  }

  .kl-subject-card-4b .kl-subject-cta:hover {
    background: #0F172A;
    color: #FFFFFF;
  }

  /**
   * Subject badge contrast.
   */
  .kl-subject-card-4b.subject-blue .kl-subject-badge {
    background: #DBEAFE;
    color: #1D4ED8;
    border-color: #93C5FD;
  }

  .kl-subject-card-4b.subject-purple .kl-subject-badge {
    background: #EDE9FE;
    color: #6D28D9;
    border-color: #C4B5FD;
  }

  .kl-subject-card-4b.subject-pink .kl-subject-badge {
    background: #FCE7F3;
    color: #BE185D;
    border-color: #F9A8D4;
  }

  .kl-subject-card-4b.subject-green .kl-subject-badge {
    background: #DCFCE7;
    color: #15803D;
    border-color: #86EFAC;
  }

  /**
   * Recommended / plan panels nhẹ hơn nhưng vẫn rõ.
   */
  .kl-panel {
    background: #FFFFFF;
    border-color: #DBEAFE;
  }

  .kl-recommended-item,
  .kl-plan-item {
    background: #F8FBFF;
    border-color: #E0F2FE;
  }

  .kl-recommended-item strong {
    color: #0F172A;
  }

  .kl-recommended-item p {
    color: #475569;
  }

  /**
   * Course summary card contrast.
   */
  .kl-course-summary-card {
    background:
      linear-gradient(135deg, #FFFFFF, #F8FBFF);
    border-color: #DBEAFE;
  }

  .kl-course-summary-value {
    color: #0F172A;
  }

  .kl-course-summary-label {
    color: #475569;
  }

  /**
   * Next lesson card contrast.
   */
  .kl-next-lesson-card h3 {
    color: #0F172A;
  }

  .kl-next-lesson-card p {
    color: #475569;
  }

  /**
   * Mobile spacing.
   */
  @media (max-width: 760px) {
    .kl-hero-card .kl-hero-kicker {
      font-size: 13px;
      padding: 7px 11px;
    }

    .kl-hero-card .kl-primary-btn,
    .kl-hero-card .kl-secondary-btn {
      width: 100%;
      justify-content: center;
    }
  }

    /**
   * ================================================================
   * KIDLEARN V3 - Phase 4C-2
   * Subject Theme Map + Subject Dashboard UI
   * ================================================================
   */

  .kl-subject-dashboard-marker-4c2 {
    display: none;
  }

  .kl-subject-dashboard-4c2 {
    --subject-primary: #2F80ED;
    --subject-pastel: #EFF6FF;
    --subject-border: #BFDBFE;
    --subject-text: #1D4ED8;
    --subject-gradient: linear-gradient(135deg, #2F80ED, #38BDF8);

    display: grid;
    gap: 18px;
    margin-top: 18px;
  }

  .kl-subject-theme-blue-4c2 {
    --subject-primary: #2F80ED;
    --subject-pastel: #EFF6FF;
    --subject-border: #BFDBFE;
    --subject-text: #1D4ED8;
    --subject-gradient: linear-gradient(135deg, #2F80ED, #38BDF8);
  }

  .kl-subject-theme-orange-4c2 {
    --subject-primary: #F97316;
    --subject-pastel: #FFF7ED;
    --subject-border: #FED7AA;
    --subject-text: #C2410C;
    --subject-gradient: linear-gradient(135deg, #F97316, #FDBA74);
  }

  .kl-subject-theme-green-4c2 {
    --subject-primary: #22C55E;
    --subject-pastel: #F0FDF4;
    --subject-border: #BBF7D0;
    --subject-text: #15803D;
    --subject-gradient: linear-gradient(135deg, #22C55E, #86EFAC);
  }

  .kl-subject-theme-red-4c2 {
    --subject-primary: #EF4444;
    --subject-pastel: #FEF2F2;
    --subject-border: #FECACA;
    --subject-text: #B91C1C;
    --subject-gradient: linear-gradient(135deg, #EF4444, #FB7185);
  }

  .kl-subject-loading-4c2,
  .kl-subject-error-4c2 {
    background: #ffffff;
    border: 1px solid var(--subject-border);
    border-radius: 26px;
    padding: 26px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, .08);
  }

  .kl-spinner-4c2 {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 4px solid #e5e7eb;
    border-top-color: var(--subject-primary);
    animation: klSpin4C2 .8s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes klSpin4C2 {
    to {
      transform: rotate(360deg);
    }
  }

  .kl-subject-hero-4c2 {
    background: var(--subject-gradient);
    border-radius: 30px;
    padding: 24px;
    color: #ffffff;
    box-shadow: 0 24px 70px rgba(15, 23, 42, .16);
    overflow: hidden;
    position: relative;
  }

  .kl-subject-hero-4c2:after {
    content: "";
    position: absolute;
    right: -40px;
    top: -60px;
    width: 210px;
    height: 210px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
  }

  .kl-subject-hero-main-4c2 {
    display: flex;
    align-items: center;
    gap: 18px;
    position: relative;
    z-index: 1;
  }

  .kl-subject-hero-icon-4c2 {
    width: 92px;
    height: 92px;
    flex: 0 0 92px;
    border-radius: 28px;
    background: rgba(255,255,255,.92);
    padding: 9px;
    box-shadow: 0 18px 42px rgba(15,23,42,.16);
  }

  .kl-subject-hero-icon-4c2 svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .kl-subject-kicker-4c2 {
    display: inline-flex;
    width: fit-content;
    border-radius: 999px;
    background: rgba(15,23,42,.22);
    border: 1px solid rgba(255,255,255,.28);
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .kl-subject-hero-4c2 h2 {
    margin: 0;
    color: #ffffff;
    font-size: clamp(26px, 4vw, 42px);
    letter-spacing: -.03em;
  }

  .kl-subject-hero-4c2 p {
    margin: 8px 0 0;
    color: rgba(255,255,255,.94);
    font-weight: 700;
  }

  .kl-subject-hero-actions-4c2 {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
    position: relative;
    z-index: 1;
  }

  .kl-subject-primary-btn-4c2 {
    background: #ffffff;
    color: var(--subject-text);
    border: 1px solid rgba(255,255,255,.82);
    box-shadow: 0 16px 34px rgba(15,23,42,.16);
  }

  .kl-subject-primary-btn-4c2:hover {
    background: #fff7ed;
    color: #0f172a;
  }

  .kl-subject-secondary-btn-4c2 {
    background: rgba(255,255,255,.18);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,.56);
  }

  .kl-subject-secondary-btn-4c2:hover {
    background: #ffffff;
    color: var(--subject-text);
  }

  .kl-subject-progress-wrap-4c2 {
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .kl-subject-progress-row-4c2 {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .kl-progress-track-4c2 {
    height: 13px;
    border-radius: 999px;
    background: rgba(255,255,255,.26);
    overflow: hidden;
  }

  .kl-progress-fill-4c2 {
    height: 100%;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(255,255,255,.4);
  }

  .kl-subject-overview-grid-4c2,
  .kl-subject-bottom-grid-4c2 {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 16px;
  }

  .kl-next-lesson-panel-4c2,
  .kl-subject-summary-panel-4c2,
  .kl-section-4c2 {
    background: #ffffff;
    border: 1.5px solid var(--subject-border);
    border-radius: 26px;
    padding: 20px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, .07);
  }

  .kl-panel-heading-4c2,
  .kl-section-title-row-4c2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .kl-panel-heading-4c2 span,
  .kl-section-title-row-4c2 span {
    color: #64748b;
    font-weight: 800;
    font-size: 13px;
  }

  .kl-panel-heading-4c2 strong {
    color: var(--subject-text);
    background: var(--subject-pastel);
    border: 1px solid var(--subject-border);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .kl-next-lesson-panel-4c2 h3,
  .kl-section-4c2 h3,
  .kl-lesson-group-4c2 h4 {
    margin: 0;
    color: #0f172a;
  }

  .kl-next-lesson-panel-4c2 p {
    color: #475569;
    font-weight: 700;
  }

  .kl-subject-summary-panel-4c2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    background: linear-gradient(135deg, #ffffff, var(--subject-pastel));
  }

  .kl-subject-summary-item-4c2 {
    background: rgba(255,255,255,.76);
    border: 1px solid var(--subject-border);
    border-radius: 20px;
    padding: 16px;
  }

  .kl-subject-summary-item-4c2 strong {
    display: block;
    color: var(--subject-text);
    font-size: 26px;
    line-height: 1;
  }

  .kl-subject-summary-item-4c2 span {
    display: block;
    color: #475569;
    font-weight: 800;
    margin-top: 6px;
  }

  .kl-lesson-group-4c2 {
    margin-top: 16px;
  }

  .kl-lesson-grid-4c2 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-top: 12px;
  }

  .kl-lesson-card-4c2 {
    background: linear-gradient(135deg, var(--subject-pastel), #ffffff);
    border: 1.5px solid var(--subject-border);
    border-radius: 22px;
    padding: 16px;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .18s ease, box-shadow .18s ease;

  .kl-lesson-card-4c2:hover {
    transform: translateY(-2px);
